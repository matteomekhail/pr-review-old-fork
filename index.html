<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Review</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="titlebar-spacer" data-tauri-drag-region></div>
        <div class="workspace" data-tauri-drag-region><img class="logo" src="/favicon.png" alt="" /><span>Pull requests</span></div>
        <nav class="views">
          <button data-kind="review" title="Review requested  ⌘1"><span class="icon">◎</span>Review requested<span class="count" data-count="review"></span></button>
          <button data-kind="involved" title="Involved  ⌘2"><span class="icon">◇</span>Involved<span class="count" data-count="involved"></span></button>
          <button data-kind="mine" class="active" title="Created by me  ⌘3"><span class="icon">◐</span>Created by me<span class="count" data-count="mine"></span></button>
        </nav>
        <div class="sidebar-foot">
          <button id="open-palette" class="foot-button" title="Command menu  /">Command menu <span class="keys"><kbd>/</kbd></span></button>
          <button id="open-help" class="foot-button" title="Keyboard shortcuts  ?">Shortcuts <span class="keys"><kbd>?</kbd></span></button>
        </div>
      </aside>
      <div class="resizer" data-resize="sidebar" title="Drag to resize · double-click to reset"></div>

      <section id="list-pane">
        <header class="pane-head drag-region" data-tauri-drag-region>
          <div class="head-title" data-tauri-drag-region>
            <h2 id="view-title" data-tauri-drag-region>Created by me</h2>
            <button id="refresh-button" class="icon-button refresh-button" title="Refresh  ⌘R"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <span id="refresh-status" class="refresh-status"></span>
            <button id="theme-button" class="icon-button theme-button" title="Theme  T"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg><kbd class="icon-kbd">T</kbd></button>
          </div>
          <div class="search"><span>⌕</span><input id="filter" title="Filter pull requests  F" placeholder="Filter" spellcheck="false" autocomplete="off" /><kbd>F</kbd></div>
        </header>
        <div class="filter-bar" id="filter-bar">
          <button data-smart="all" class="chip active" title="Show all  ⌥0">All <span class="chip-count" data-smart-count="all"></span></button>
          <button data-smart="ready" class="chip" title="Ready: green, mergeable, no changes requested  ⌥1"><i class="dot ok"></i>Ready <span class="chip-count" data-smart-count="ready"></span></button>
          <button data-smart="small" class="chip" title="Small: 150 changed lines or fewer  ⌥2">Small <span class="chip-count" data-smart-count="small"></span></button>
          <button data-smart="recent" class="chip" title="Recent: updated in the last 48 hours  ⌥3">Recent <span class="chip-count" data-smart-count="recent"></span></button>
          <button data-smart="tested" class="chip" title="E2E tested: body or comments show the change was actually run end to end (AI, needs OPENROUTER_API_KEY)  ⌥5"><i class="dot ok"></i>Tested <span class="chip-count" data-smart-count="tested"></span></button>
          <button data-smart="attention" class="chip chip-attention" title="Needs attention: conflicts, failing, blocked or not approved  ⌥4"><i class="dot bad"></i>Attention <span class="chip-count" data-smart-count="attention"></span></button>
          <button id="open-triage" class="chip chip-agent" title="Send PRs that need attention to an agent  ⇧X"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1.5l1.6 3.9 3.9 1.6-3.9 1.6L8 12.5 6.4 8.6 2.5 7l3.9-1.6z" fill="currentColor"/></svg>Fix with agent <kbd>⇧</kbd><kbd>X</kbd></button>
          <button id="toggle-grouping" class="chip" title="Group related work  ⇧T"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="1.5" y="2" width="13" height="3" rx="1" fill="none" stroke="currentColor"/><rect x="3.5" y="7" width="11" height="2.5" rx="1" fill="none" stroke="currentColor"/><rect x="3.5" y="11.5" width="11" height="2.5" rx="1" fill="none" stroke="currentColor"/></svg>Group</button>
          <span id="ai-status" class="ai-status off" title="Smart sort uses built-in rules">Rules</span>
          <select id="sort" class="sort" title="Sort order  ⇧S">
            <option value="smart">Smart</option>
            <option value="updated">Updated</option>
            <option value="size">Smallest</option>
          </select>
        </div>
        <ol id="pr-list"></ol>
        <div id="bulk-bar" hidden>
          <span id="bulk-count"></span>
          <button id="bulk-ready" class="ghost" title="Select every Ready PR  ⇧R">Select ready <kbd>⇧</kbd><kbd>R</kbd></button>
          <button id="bulk-clear" class="ghost" title="Clear selection  Esc">Clear <kbd>esc</kbd></button>
          <button id="bulk-approve" class="ghost" title="Approve selected  ⇧A">Approve <kbd>⇧</kbd><kbd>A</kbd></button>
          <button id="bulk-merge" class="primary" title="Merge selected  ⌘↵">Merge <kbd>⌘</kbd><kbd>↵</kbd></button>
        </div>
      </section>
      <div class="resizer" data-resize="list" title="Drag to resize · double-click to reset"></div>

      <main id="detail">
        <div id="empty" class="empty" data-tauri-drag-region>Loading…</div>
        <section id="pr" hidden>
          <header id="pr-head" class="drag-region" data-tauri-drag-region>
            <div class="head-left" data-tauri-drag-region>
              <button class="icon-button" id="toggle-sidebar" title="Toggle sidebar  ⌘B" aria-keyshortcuts="Meta+B">
                <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><line x1="5.5" y1="2.5" x2="5.5" y2="13.5" stroke="currentColor"/></svg><kbd class="icon-kbd">⌘B</kbd>
              </button>
              <div class="crumbs" id="crumbs" data-tauri-drag-region></div>
            </div>
            <div class="actions">
              <button id="toggle-mode" class="ghost" title="Side-by-side: description left, diff right  V">Side by side <kbd>V</kbd></button>
              <button id="toggle-all" class="ghost" title="Collapse or expand all files  ⇧C">Collapse all <kbd>⇧</kbd><kbd>C</kbd></button>
              <button id="approve" class="ghost" title="Approve  A">Approve <kbd>A</kbd></button>
              <div class="split-button">
                <button id="merge" class="primary" title="Merge  ⌘↵">Squash and merge <kbd>⌘</kbd><kbd>↵</kbd></button>
                <select id="merge-method" title="Merge method  ⇧M">
                  <option value="squash">Squash</option>
                  <option value="merge">Merge commit</option>
                  <option value="rebase">Rebase</option>
                </select>
              </div>
              <button class="ghost" id="open-github" title="Open on GitHub  O"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><kbd>O</kbd></button>
              <button class="icon-button" id="toggle-inspector" title="Toggle details panel  ⌘I">
                <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><line x1="10.5" y1="2.5" x2="10.5" y2="13.5" stroke="currentColor"/></svg><kbd class="icon-kbd">⌘I</kbd>
              </button>
            </div>
          </header>
          <div id="status-bar" class="status-bar" data-tauri-drag-region></div>
          <div id="pr-body-split">
            <div id="desc-pane"></div>
            <div class="resizer" data-resize="description" title="Drag to resize · double-click to reset"></div>
            <div id="diff-root"></div>
            <div class="resizer" data-resize="inspector" title="Drag to resize · double-click to reset"></div>
            <aside id="inspector">
              <section class="file-tree">
                <div class="section-title" role="button" tabindex="-1" title="Collapse / expand files  ⇧F"><span class="files-label"><span class="caret">›</span>Files</span><span id="file-count" class="muted"></span></div>
                <nav id="files"></nav>
              </section>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" role="status"></div>

    <dialog id="confirm">
      <form method="dialog">
        <div class="dialog-title" id="confirm-title"></div>
        <p id="confirm-text"></p>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="ok" class="primary" autofocus>Merge <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="bulk-confirm">
      <form method="dialog">
        <div class="dialog-title" id="bulk-confirm-title"></div>
        <ol id="bulk-confirm-list" class="bulk-list"></ol>
        <p class="muted" id="bulk-confirm-note"></p>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="ok" class="primary" autofocus>Merge all <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="triage">
      <form method="dialog">
        <div class="dialog-title" id="triage-title"></div>
        <p class="muted triage-sub">Everything that is conflicted, failing, blocked or not approved. Untick a group to leave it out, then paste the prompt into Codex, Claude or Devin.</p>
        <div id="triage-sections" class="triage-sections"></div>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="copy" id="triage-copy" class="primary">Copy prompt <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="help">
      <form method="dialog">
        <div class="dialog-title">Keyboard shortcuts</div>
        <div id="shortcut-list" class="shortcut-list"></div>
        <menu><button value="close" class="ghost">Close <kbd>esc</kbd></button></menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Review</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <div id="app">
      <section id="list-pane">
        <header class="pane-head drag-region" data-tauri-drag-region>
          <div class="head-title" data-tauri-drag-region>
            <img class="logo" src="/favicon.png" alt="" data-tauri-drag-region />
            <h2 id="view-title" class="sr-only">Created by me</h2>
            <nav class="views view-pills h-scroll">
              <button data-kind="mine" class="active" title="Created by me  ⌘3">Mine <span class="count" data-count="mine"></span></button>
              <button data-kind="review" title="Review requested  ⌘1">Review <span class="count" data-count="review"></span></button>
              <button data-kind="involved" title="Involved  ⌘2">Involved <span class="count" data-count="involved"></span></button>
            </nav>
            <button id="refresh-button" class="icon-button refresh-button" title="Refresh  ⌘R"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <span id="refresh-status" class="refresh-status"></span>
            <button id="open-palette" class="icon-button" title="Command menu  ⌘K"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
            <button id="open-help" class="icon-button" title="Keyboard shortcuts  ?"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 7h1M7 7h1M10 7h2M4.5 9.5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          </div>
        </header>
        <div class="filter-bar h-scroll" id="filter-bar">
          <button id="toggle-grouping" class="chip" title="Group related work  ⇧T"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="1.5" y="2" width="13" height="3" rx="1" fill="none" stroke="currentColor"/><rect x="3.5" y="7" width="11" height="2.5" rx="1" fill="none" stroke="currentColor"/><rect x="3.5" y="11.5" width="11" height="2.5" rx="1" fill="none" stroke="currentColor"/></svg>Group <kbd>⇧</kbd><kbd>T</kbd></button>
          <button id="open-triage" class="chip chip-agent" title="Copy an agent prompt to fix every PR that needs attention  ⇧X"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1.5l1.6 3.9 3.9 1.6-3.9 1.6L8 12.5 6.4 8.6 2.5 7l3.9-1.6z" fill="currentColor"/></svg>Fix <kbd>⇧</kbd><kbd>X</kbd></button>
          <span class="chip-sep"></span>
          <button data-smart="all" class="chip active" title="Show all  ⌥0">All <span class="chip-count" data-smart-count="all"></span></button>
          <button data-smart="ready" class="chip" title="Ready: green, mergeable, no changes requested  ⌥1"><i class="dot ok"></i>Ready <span class="chip-count" data-smart-count="ready"></span></button>
          <button data-smart="attention" class="chip chip-attention" title="Show unready PRs  ⌥4 · select them all  ⇧U"><i class="dot bad"></i>Unready <span class="chip-count" data-smart-count="attention"></span></button>
          <span id="ai-status" class="ai-status off" title="Smart sort uses built-in rules">Rules</span>
          <select id="sort" class="sort" title="Sort order  ⇧S">
            <option value="smart">Smart</option>
            <option value="updated">Updated</option>
            <option value="size">Smallest</option>
          </select>
        </div>
        <ol id="pr-list"></ol>
        <div id="bulk-bar" hidden>
          <span id="bulk-count"></span>
          <button id="bulk-ready" class="ghost" title="Select every Ready PR  ⇧R">Ready <kbd>⇧</kbd><kbd>R</kbd></button>
          <button id="bulk-unready" class="ghost" title="Select every PR that needs attention  ⇧U">Unready <kbd>⇧</kbd><kbd>U</kbd></button>
          <button id="bulk-clear" class="ghost" title="Clear selection  Esc">Clear <kbd>esc</kbd></button>
          <button id="bulk-approve" class="ghost" title="Approve selected  ⇧A">Approve <kbd>⇧</kbd><kbd>A</kbd></button>
          <button id="bulk-merge" class="primary" title="Merge selected  ⌘↵">Merge <kbd>⌘</kbd><kbd>↵</kbd></button>
        </div>
      </section>
      <div class="resizer" data-resize="list" title="Drag to resize · double-click to reset"></div>

      <main id="detail">
        <div id="empty" class="empty" data-tauri-drag-region>Loading…</div>
        <section id="pr" hidden>
          <header id="pr-head" class="drag-region" data-tauri-drag-region>
            <div class="head-left" data-tauri-drag-region>
              <button class="icon-button" id="toggle-sidebar" title="Toggle PR list  ⌘B" aria-keyshortcuts="Meta+B">
                <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><line x1="5.5" y1="2.5" x2="5.5" y2="13.5" stroke="currentColor"/></svg><kbd class="icon-kbd">⌘B</kbd>
              </button>
              <div class="crumbs" id="crumbs" data-tauri-drag-region></div>
            </div>
            <div class="actions">
              <button id="theme-button" class="ghost icon-action theme-button" title="Theme  T"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg><kbd class="icon-kbd">T</kbd></button>
              <div class="search"><span>⌕</span><input id="filter" title="Filter pull requests  /" placeholder="Filter" spellcheck="false" autocomplete="off" /><kbd>/</kbd></div>
              <button id="comment-button" class="ghost icon-action" title="Write a comment  C"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><kbd class="icon-kbd">C</kbd></button>
              <button id="approve" class="ghost icon-action" title="Approve  A"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><kbd class="icon-kbd">A</kbd></button>
              <button id="merge" class="primary merge-icon" title="Squash and merge  ⌘↵"></button>
              <button class="ghost icon-action" id="open-preview" title="Open preview deployment  P" disabled><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5h13" stroke="currentColor" stroke-width="1.4"/><circle cx="3.6" cy="4" r=".6" fill="currentColor"/><circle cx="5.4" cy="4" r=".6" fill="currentColor"/><path d="M6.5 8.2 9.8 10l-3.3 1.8z" fill="currentColor"/></svg><kbd class="icon-kbd">P</kbd></button>
              <button class="ghost icon-action" id="open-devin" title="Open Devin session  D" disabled><svg class="devin-logo" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M5.9 1.6 8.3 3v2.8L5.9 7.2 3.5 5.8V3zM11.1 4.6l2.4 1.4v2.8l-2.4 1.4-2.4-1.4V6zM5.9 8.8l2.4 1.4V13l-2.4 1.4L3.5 13v-2.8z"/><path d="M8.2 5.7 8.9 6.2M8.2 10.3 8.9 9.8" stroke="currentColor" stroke-width="1.2"/></svg><kbd class="icon-kbd">D</kbd></button>
              <button class="ghost icon-action" id="open-github" title="Open on GitHub  O"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><kbd>O</kbd></button>
            </div>
          </header>
          <div id="status-bar" class="status-bar h-scroll" data-tauri-drag-region></div>
          <div id="pr-body-split">
            <div id="desc-pane"></div>
            <div class="resizer" data-resize="description" title="Drag to resize · double-click to reset"></div>
            <div id="diff-root"></div>
            <div class="resizer" data-resize="inspector" title="Drag to resize · double-click to reset"></div>
            <aside id="inspector">
              <nav id="files" hidden></nav><span id="file-count" hidden></span>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" role="status"></div>

    <dialog id="comment-dialog">
      <form method="dialog">
        <div class="dialog-title" id="comment-title">Comment</div>
        <textarea id="comment-body" rows="6" placeholder="Leave a comment… (markdown, @mentions work)" spellcheck="true"></textarea>
        <div class="comment-hint muted" id="comment-hint"></div>
        <menu>
          <button value="cancel" class="ghost" type="button" id="comment-cancel">Cancel <kbd>esc</kbd></button>
          <button value="send" class="primary" type="button" id="comment-send">Comment <kbd>⌘</kbd><kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirm">
      <form method="dialog">
        <div class="dialog-title" id="confirm-title"></div>
        <p id="confirm-text"></p>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="ok" class="primary" autofocus>Merge <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="bulk-confirm">
      <form method="dialog">
        <div class="dialog-title" id="bulk-confirm-title"></div>
        <ol id="bulk-confirm-list" class="bulk-list"></ol>
        <p class="muted" id="bulk-confirm-note"></p>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="ok" class="primary" autofocus>Merge all <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="triage">
      <form method="dialog">
        <div class="dialog-title" id="triage-title"></div>
        <p class="muted triage-sub">Everything that is conflicted, failing, blocked or not approved. Untick a group to leave it out, then paste the prompt into Codex, Claude or Devin.</p>
        <div id="triage-sections" class="triage-sections"></div>
        <menu>
          <button value="cancel" class="ghost">Cancel <kbd>esc</kbd></button>
          <button value="copy" id="triage-copy" class="primary">Copy prompt <kbd>↵</kbd></button>
        </menu>
      </form>
    </dialog>

    <dialog id="help">
      <form method="dialog">
        <div class="dialog-title">Keyboard shortcuts</div>
        <div id="shortcut-list" class="shortcut-list"></div>
        <menu><button value="close" class="ghost">Close <kbd>esc</kbd></button></menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
